# The smallest useful spec.  Render it with:
#
#   python3 scripts/render.py examples/quickstart.yaml -o build/quickstart \
#           -f svg,pdf,png,pptx,vsdx --dpi 600
#
# Then open build/quickstart.pptx in PowerPoint, or build/quickstart.vsdx in
# Visio, and move a box.  Everything is a native shape.
figure:
  id: quickstart
  venue: cvpr          # cvpr iccv eccv neurips iclr icml aaai acl siggraph
  width: double        # single | double | a number in points
  font: times          # times | helvetica -- match the venue body font

layout: row
gap: 14

panels:
  - id: s_input
    title: "Input"
    frame: dashed
    valign: middle
    body:
      - row:
          gap: 9
          align: center
          body:
            - {id: img, shape: image, w: 72, h: 50, caption: "RGB frame"}
            - {id: enc, shape: trapezoid, text: "Backbone", role: encoder}

  - id: s_core
    title: "Our Contribution"
    frame: dashed
    fill: gold.pale
    valign: middle
    body:
      - {id: q, shape: slab, n: 5, cell: 8, cellh: 26, role: attention,
         caption: "*N* queries"}
      - {id: sp, shape: spacer, h: 6, w: 4}
      - group:
          id: blk
          frame: region
          frame_color: gold.deep
          badge: "×L"
          gap: 5
          body:
            - {id: b1, text: "Cross-Attention", role: core, outline: match}
            - {id: b2, text: "Feed Forward", role: core, tint: light, outline: match}
      - {id: sp2, shape: spacer, h: 6, w: 4}
      - {id: sum, shape: circleop, op: "+", d: 12}

  - id: s_out
    title: "Prediction"
    frame: dashed
    valign: middle
    body:
      - row:
          gap: 9
          align: center
          body:
            - {id: head, text: "Decoder", role: decoder}
            - {id: out, shape: image, w: 72, h: 50, caption: "result"}

edges:
  - {from: img, to: enc}
  - {from: enc, to: q}
  - {from: q, to: blk, color: gold.deep}
  - {from: b1, to: b2, color: gold.deep, lw: box}
  - {from: blk, to: sum, color: gold.deep}
  # the skip connection leaves on the left so it never shares a port with
  # the block's own output on the right
  - {from: q.w, to: sum.w, route: bus, bend: 10, dash: true, lw: box,
     color: gold.deep, label: "residual", label_size: 5.8, label_pos: 0.5,
     label_dx: -3, label_anchor: end}
  - {from: sum, to: head}
  - {from: head, to: out}

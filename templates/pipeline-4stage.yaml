# Four-stage perception -> forecasting -> decoding pipeline.
# Archetype: the standard CVPR/AAAI "overview" figure, one dashed stage
# container per pipeline phase, colour-coded data flow between them.
figure:
  id: pipeline-4stage
  venue: aaai
  width: double
  font: times

layout: row
gap: 9

panels:
  # ------------------------------------------------ stage 1: inputs
  - id: s_backbone
    title: "Image Backbone"
    frame: dashed
    valign: top
    body:
      - row:
          gap: 6
          body:
            - {id: traj, shape: image, w: 44, h: 29, caption: "Historical\nTrajectories"}
            - {id: plus0, shape: text, text: "+", size: 11}
            - {id: lq, shape: image, w: 44, h: 29, caption: "Learnable\nQueries"}
      - {id: gap1, shape: spacer, h: 6, w: 4}
      - {id: vox, shape: plane, w: 70, h: 26, role: neutral, skew: 0.30}
      - {id: gap2, shape: spacer, h: 8, w: 4}
      - {id: cams, shape: image, w: 96, h: 63, caption: "Surround-view Cameras"}

  # ------------------------------ stage 2: the paper's core contribution
  - id: s_perc
    title: "Range-Adaptive Perception"
    frame: dashed
    valign: top
    body:
      - {id: scale, text: "Adaptive Scaling", role: encoder, tint: light}
      - {id: gapA, shape: spacer, h: 4, w: 4}
      - row:
          gap: 7
          body:
            - {id: qbank, shape: slab, n: 6, cell: 6, cellh: 22, role: neutral, fill: "#FFFFFF"}
            - {id: plus1, shape: circleop, op: "+", d: 10}
            - {id: lidar, shape: image, w: 52, h: 26}
      - {id: gapB, shape: spacer, h: 4, w: 4}
      - group:
          id: block
          fill: gold.pale
          frame: region
          frame_color: gold.deep
          badge: "×L"
          gap: 5
          pad: 7
          body:
            - {id: fs,   text: "Feature Sampling",        role: core, tint: mid,  outline: match}
            - {id: am,   text: "Adaptive Mixing",         role: core, tint: light, outline: match}
            - {id: mhsa, text: "Temporal-Spatial MHSA",   role: core, tint: mid,  outline: match}
            - {id: an1,  text: "Add & Norm",              role: core, tint: light, outline: match}
            - {id: ffn,  text: "Feed Forward Network",    role: core, tint: light, outline: match}
            - {id: an2,  text: "Add & Norm",              role: core, tint: light, outline: match}
      - {id: gapC, shape: spacer, h: 6, w: 4}
      - {id: occ1, shape: image, w: 98, h: 42}

  # ------------------------------------------- stage 3: temporal rollout
  - id: s_fc
    title: "State-Conditioned Forecasting"
    frame: dashed
    valign: top
    fill: orange.pale
    frame_color: "#A5A5A5"
    body:
      - group:
          id: updated
          frame: region
          frame_color: orange.strong
          badge: "×f"
          gap: 6
          pad: 6
          arrange: row
          row:
            - {id: uq, shape: slab, n: 5, cell: 6, cellh: 24, role: attention}
            - {id: plus2, shape: text, text: "+", size: 11}
            - {id: upos, shape: image, w: 38, h: 24}
          title: "Updated Queries & Positions"
          title_pos: below
          title_size: 6.6
          title_bold: false
          title_italic: false
      - {id: gapD, shape: spacer, h: 9, w: 4}
      - {id: refine, text: "Refinement", role: temporal, tint: soft, outline: match}
      - {id: gapE, shape: spacer, h: 7, w: 4}
      - {id: sum1, shape: circleop, op: "+", d: 11}
      - {id: gapF, shape: spacer, h: 5, w: 4}
      - row:
          gap: 10
          body:
            - {id: pe, shape: trapezoid, text: "PE", role: temporal, tint: soft, dir: up, w: 30, h: 15}
            - {id: qt, shape: slab, n: 4, cell: 5, cellh: 20, role: neutral, fill: "#FFFFFF", badge: "×N"}
      - {id: gapG, shape: spacer, h: 5, w: 4}
      - row:
          gap: 8
          body:
            - {id: qhat, shape: slab, n: 5, cell: 7, cellh: 24, role: attention}
            - {id: qego, shape: slab, n: 1, cell: 11, cellh: 26, role: decoder}
      - {id: gapH, shape: spacer, h: 6, w: 4}
      - {id: sca, text: "Spatial Cross-Attention", role: attention, tint: mid, outline: match}
      - {id: gapI, shape: spacer, h: 6, w: 4}
      - row:
          gap: 8
          body:
            - {id: q0, shape: slab, n: 5, cell: 7, cellh: 22, role: attention}
            - {id: qe0, shape: slab, n: 1, cell: 11, cellh: 24, role: decoder}

  # ------------------------------------------------ stage 4: two heads
  - id: s_dec
    title: "Parallel Decoders"
    frame: dashed
    valign: top
    body:
      - {id: occdec, text: "Occupancy Decoding", role: decoder, tint: light}
      - {id: gapJ, shape: spacer, h: 8, w: 4}
      - {id: occout, shape: image, w: 94, h: 46, badge: "×f"}
      - {id: gapK, shape: spacer, h: 14, w: 4}
      - {id: plandec, text: "Planning Decoding", role: decoder, tint: light}
      - {id: gapL, shape: spacer, h: 8, w: 4}
      - {id: planout, shape: image, w: 94, h: 46, badge: "×f"}

edges:
  - {from: cams, to: vox, route: straight, lw: flow}
  - {from: vox.e, to: fs.w, route: hv, lw: flow}
  - {from: lq.e, to: scale.w, route: hv, lw: flow}
  - {from: scale, to: qbank.n, route: vh, lw: flow, arrow: none}
  - {from: qbank.s, to: block.n, color: gold.deep, mid: 0.5}
  - {from: fs, to: am, color: gold.deep, lw: box}
  - {from: am, to: mhsa, color: gold.deep, lw: box}
  - {from: mhsa, to: an1, color: gold.deep, lw: box}
  - {from: an1, to: ffn, color: gold.deep, lw: box}
  - {from: ffn, to: an2, color: gold.deep, lw: box}
  - {from: mhsa.e, to: an1.e, route: bus, bend: 9, color: gold.deep, lw: box}
  - {from: ffn.e, to: an2.e, route: bus, bend: 9, color: gold.deep, lw: box}
  - {from: block.s, to: occ1.n, color: gold.deep}
  - {from: occ1.e, to: q0.w, route: hv, color: gold.deep}
  - {from: q0.n, to: sca.s, color: temporal}
  - {from: sca.n, to: qhat.s, color: temporal}
  - {from: qhat.n, to: pe.s, color: temporal}
  - {from: pe.n, to: sum1.s, color: temporal}
  - {from: qt.n, to: sum1.e, route: vh, color: temporal}
  - {from: sum1.n, to: refine.s, color: temporal}
  - {from: refine.n, to: updated.s, color: temporal}
  - {from: qe0.e, to: qego.e, route: bus, bend: 8, color: temporal, dash: true}
  - {from: updated.e, to: occdec.w, color: temporal}
  - {from: qego.e, to: plandec.w, color: temporal}
  - {from: occdec.s, to: occout.n, lw: flow}
  - {from: plandec.s, to: planout.n, lw: flow}

# Nested-set teaser: what one evaluator can see versus what another can see.
# Archetype: the page-1 figure of an analysis or evaluation paper, where the
# contribution is a *distinction* rather than a module.  The nesting carries
# the argument -- one evaluator's inputs are a strict subset of the other's --
# so no arrow has to cross another.
figure:
  id: blindspot-teaser
  venue: cvpr
  width: single
  font: times
  pad_top: 10

layout: col
gap: 11

panels:
  - id: top
    frame: none
    body:
      - row:
          gap: 8
          align: center
          body:
            - {id: inp, shape: framestrip, pattern: "####################",
               cell: 2.6, cellgap: 0.7, h: 13, on_fill: steel.mid,
               caption: "input", caption_size: 5.8}
            - {id: sys, text: "frozen\nsystem", role: baseline, wrap: 42, size: 6.6}
            - group:
                id: seen_wide
                frame: region
                frame_color: rose.strong
                fill: rose.pale
                pad: 5
                padt: 14
                title: "read by the honest measure"
                title_pos: above
                title_align: right
                title_size: 6.0
                title_bold: false
                title_italic: true
                title_color: "#953735"
                row:
                  gap: 4
                  body:
                    - group:
                        id: seen_narrow
                        frame: region
                        frame_color: steel.deep
                        fill: steel.pale
                        pad: 4
                        title: "read by the standard metric"
                        title_pos: above
                        title_align: left
                        title_size: 6.0
                        title_bold: false
                        title_italic: true
                        title_color: "#2E75B6"
                        body:
                          - {id: c1, text: "*α*", role: backbone, w: 26, h: 19, size: 8.0}
                    - {id: c2, text: "*β*", role: core, w: 26, h: 19, size: 8.0}
                    - {id: c3, text: "*γ*", role: core, w: 26, h: 19, size: 8.0}

  - id: bottom
    frame: none
    body:
      - row:
          gap: 14
          align: start
          body:
            - id: lane_a
              col:
                gap: 4
                body:
                  - {id: m_a, text: "standard metric", role: baseline, minw: 104}
                  - {id: v_a, shape: text, size: 6.6, text_color: "#2E75B6",
                     text: "0.00  →  **0.00**"}
                  - {id: n_a, shape: text, size: 6.0, text_color: muted,
                     text: "*unchanged by construction*"}
            - id: lane_b
              col:
                gap: 4
                body:
                  - {id: m_b, text: "honest measure", role: memory, minw: 104}
                  - {id: v_b, shape: text, size: 6.6, text_color: "#953735",
                     text: "0.00  →  **0.00**"}
                  - {id: n_b, shape: text, size: 6.0, text_color: muted,
                     text: "*large, same system*"}

  - id: thesis
    frame: none
    body:
      - {id: line, shape: text, size: 6.4, text_color: "#BF9000", italic: true,
         text: "the components the standard metric cannot read carry the failure"}

edges:
  - {from: inp, to: sys}
  - {from: sys, to: seen_wide}
  - {from: seen_narrow.s, to: m_a.n, color: steel.deep}
  - {from: seen_wide.s, to: m_b.n, color: rose.strong, mid: 0.55}

notes:
  - {text: "regime A  →  regime B", near: inp.n, dy: -6.5, size: 6.0, color: muted}

# Counterfactual / ablation factorial.
# Archetype: an analysis paper's central design figure -- two binary factors
# crossed into four conditions, with the cell that carries the claim called out.
# The whole point is that the reader can read a *row* and a *column* as a
# controlled contrast, so the axis headers do as much work as the cells.
figure:
  id: factorial-2x2
  venue: aaai
  width: single
  font: times
  pad_top: 2

layout: col
gap: 7

panels:
  - id: grid
    frame: none
    body:
      # column axis title, offset to sit over the cells rather than the row head
      - row:
          gap: 0
          justify: start
          body:
            - {id: pad0, shape: spacer, w: 46, h: 8}
            - {id: coltitle, shape: text, text: "**factor A** taken from",
               size: 6.8, w: 150}
      - row:
          gap: 0
          justify: start
          body:
            - {id: pad1, shape: spacer, w: 46, h: 9}
            - {id: colA, shape: text, text: "level 1", size: 6.6, w: 74}
            - {id: colB, shape: text, text: "level 2", size: 6.6, w: 74}
      - row:
          gap: 4
          align: center
          body:
            - {id: rowtitle, shape: text, text: "**factor B** taken from",
               size: 6.8, rotate: 90, w: 10, h: 96}
            - id: rowheads
              col:
                gap: 6
                body:
                  - {id: rowA, shape: text, text: "level 1", size: 6.6, w: 30, h: 44}
                  - {id: rowB, shape: text, text: "level 2", size: 6.6, w: 30, h: 44}
            - id: cells
              col:
                gap: 6
                body:
                  - row:
                      gap: 6
                      body:
                        - {id: cA, text: "**A**\nreference", role: baseline,
                           outline: match, w: 70, h: 44, size: 6.6}
                        - {id: cB, text: "**B**\nfactor A only", role: attention,
                           outline: match, w: 70, h: 44, size: 6.6}
                  - row:
                      gap: 6
                      body:
                        - {id: cC, text: "**C**\nfactor B only", role: ours,
                           outline: match, lw: emphasis, w: 70, h: 44, size: 6.6}
                        - {id: cD, text: "**D**\nboth (real)", role: decoder,
                           outline: match, w: 70, h: 44, size: 6.6}

  # the sentence that tells the reader what the grid is for
  - id: note
    frame: none
    body:
      - {id: claim, shape: text, size: 6.2, italic: true, text_color: "#C00000",
         text: "left column: metric identical to A by construction"}

edges:
  - {from: cA.e, to: cB.w, arrow: none, lw: hairline, dash: thin}
  - {from: cA.s, to: cC.n, arrow: none, lw: hairline, dash: thin}

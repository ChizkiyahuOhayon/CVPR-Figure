# Two-branch training figure: teacher/student, momentum encoder, contrastive
# pair, or any setup where two paths meet at a loss.
# Archetype: the method figure for self-supervised, distillation and
# consistency-regularised training.  The symmetry is the point, so the two
# branches must be visually parallel and differ in exactly the ways claimed.
figure:
  id: dual-branch
  venue: cvpr
  width: double
  font: times
  pad_top: 3

layout: row
gap: 13

panels:
  - id: s_in
    title: "Input"
    frame: dashed
    valign: middle
    body:
      - {id: aug1, text: "strong\naugmentation", role: input, size: 6.4, wrap: 62}
      - {id: sp0, shape: spacer, h: 16, w: 4}
      - {id: img, shape: image, w: 60, h: 44, caption: "sample", caption_size: 6.0}
      - {id: sp0b, shape: spacer, h: 16, w: 4}
      - {id: aug2, text: "weak\naugmentation", role: input, size: 6.4, wrap: 62}

  - id: s_branch
    title: "Two Branches"
    frame: dashed
    valign: middle
    padb: 16
    body:
      - group:
          id: online
          frame: region
          frame_color: gold.deep
          fill: gold.pale
          pad: 6
          gap: 5
          title: "online branch (updated)"
          title_pos: below
          title_size: 6.0
          title_bold: false
          title_italic: true
          title_color: "#BF6000"
          row:
            gap: 6
            body:
              - {id: enc_o, shape: trapezoid, text: "encoder *f*_{θ}", role: encoder, size: 6.4}
              - {id: proj_o, text: "projector *g*_{θ}", role: attention, size: 6.4}
              - {id: pred_o, text: "predictor", role: ours, size: 6.4}
      - {id: sp1, shape: spacer, h: 14, w: 4}
      - group:
          id: target
          frame: region
          frame_color: grey.strong
          fill: grey.pale
          pad: 6
          gap: 5
          title: "target branch (EMA, stop-grad)"
          title_pos: below
          title_size: 6.0
          title_bold: false
          title_italic: true
          title_color: muted
          row:
            gap: 6
            body:
              - {id: enc_t, shape: trapezoid, text: "encoder *f*_{ξ}", role: baseline, size: 6.4}
              - {id: proj_t, text: "projector *g*_{ξ}", role: baseline, size: 6.4}
              - {id: stop, text: "stop-grad", role: neutral, size: 6.4}

  - id: s_loss
    title: "Objective"
    frame: dashed
    valign: middle
    body:
      - {id: z1, shape: slab, n: 3, cell: 7, cellh: 22, role: ours,
         caption: "*z*", caption_size: 6.0}
      - {id: sp2, shape: spacer, h: 8, w: 4}
      - {id: loss, text: "consistency loss", role: loss, size: 6.4, minw: 88}
      - {id: sp3, shape: spacer, h: 8, w: 4}
      - {id: z2, shape: slab, n: 3, cell: 7, cellh: 22, role: baseline,
         caption: "*z*'", caption_size: 6.0}

edges:
  - {from: img.n, to: aug1.s, lw: box}
  - {from: img.s, to: aug2.n, lw: box}
  - {from: aug1.e, to: enc_o.w, color: gold.deep, route: hv}
  - {from: aug2.e, to: enc_t.w, color: grey, route: hv}
  - {from: enc_o, to: proj_o, color: gold.deep, lw: box}
  - {from: proj_o, to: pred_o, color: gold.deep, lw: box}
  - {from: enc_t, to: proj_t, color: grey, lw: box}
  - {from: proj_t, to: stop, color: grey, lw: box}
  - {from: pred_o.e, to: z1.w, color: gold.deep, route: hv}
  - {from: stop.e, to: z2.w, color: grey, route: hv}
  - {from: z1.s, to: loss.n, color: rose.strong}
  - {from: z2.n, to: loss.s, color: rose.strong}
  - {from: online.w, to: target.w, route: bus, bend: 10, dash: true, lw: box,
     color: gold.deep, label: "EMA", label_size: 5.8, label_dx: 3, label_anchor: start}
